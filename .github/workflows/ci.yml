name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: ucm_test
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucm_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ucm_test:ci-only-database-password@127.0.0.1:5432/postgres
      UCM_TEST_DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils postgresql-client
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run references:fetch
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run source:export -- "$RUNNER_TEMP/public-source"
      - name: Scan public source for secrets
        run: >-
          docker run --rm -v "$RUNNER_TEMP/public-source:/source:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /source --redact --no-banner
